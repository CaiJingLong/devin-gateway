services:
  devin-gateway:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Optional: fallback token for requests that omit Authorization/x-api-key
      - DEVIN_API_KEY=${DEVIN_API_KEY:-}
      # Optional: override Devin API base URL
      - DEVIN_BASE_URL=${DEVIN_BASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
